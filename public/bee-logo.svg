<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Bee body -->
  <ellipse cx="24" cy="28" rx="10" ry="12" fill="#ebb331"/>
  <!-- Stripes -->
  <rect x="14" y="24" width="20" height="3" rx="1" fill="#2b2b2b"/>
  <rect x="14" y="30" width="20" height="3" rx="1" fill="#2b2b2b"/>
  <!-- Head -->
  <circle cx="24" cy="16" r="6" fill="#2b2b2b"/>
  <!-- Eyes -->
  <circle cx="22" cy="15" r="1.5" fill="#fff"/>
  <circle cx="26" cy="15" r="1.5" fill="#fff"/>
  <!-- Wings -->
  <ellipse cx="16" cy="22" rx="6" ry="4" fill="rgba(255,255,255,0.8)" transform="rotate(-20 16 22)"/>
  <ellipse cx="32" cy="22" rx="6" ry="4" fill="rgba(255,255,255,0.8)" transform="rotate(20 32 22)"/>
  <!-- Antennae -->
  <line x1="21" y1="11" x2="18" y2="6" stroke="#2b2b2b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="11" x2="30" y2="6" stroke="#2b2b2b" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="18" cy="5" r="1.5" fill="#ebb331"/>
  <circle cx="30" cy="5" r="1.5" fill="#ebb331"/>
  <!-- Stinger -->
  <path d="M24 40 L22 44 L26 44 Z" fill="#2b2b2b"/>
</svg>
